name: Security image publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: security-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch and check frontend dependencies
        working-directory: .
        run: |
          npm audit fix --package-lock-only --no-fund || audit_status=$?
          npm ci --no-fund --no-audit
          npm run build
      - name: Publish dependency sources to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json package.json
          if ! git diff --cached --quiet; then
            git commit -m 'Patch application dependency locks [skip ci]'
            git push origin HEAD:main
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          pull: true
          push: true
          tags: ghcr.io/fabiokaelin/keys:security-20261029
